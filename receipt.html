<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Croissant Noir</title>
  <link rel="icon" type="image/png" href="images/icon.png" />
  <style>
    body {
      background: #fef1e7;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .receipt-container {
      background: white;
      width: 380px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .logo {
      width: 100px;
      margin-bottom: 10px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
      color: #d2691e;
      margin-bottom: 20px;
    }

    .receipt-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #6d4c41;
    }

    .date {
      font-size: 14px;
      color: #8d6e63;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
      font-size: 14px;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

    th {
      text-align: left;
      font-weight: bold;
      color: #5d4037;
    }

    .summary {
      text-align: right;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .summary strong {
      display: inline-block;
      width: 80px;
    }

    .thank-you {
      font-weight: bold;
      color: #8d4b2c;
      margin-top: 20px;
    }

    .footer-img {
      width: 60px;
      margin-top: 10px;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #6d4c41;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">Back to Home</a>

  <div class="receipt-container">
    <img src="images/logo.png" alt="Logo" class="logo">
    <div class="brand">Croissant Noir</div>
    <div class="receipt-title">Receipt</div>
    <div class="date" id="date-time"></div>

    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="receipt-items"></tbody>
    </table>

    <div class="summary">
      <div><strong>Total:</strong> ₱<span id="total"></span></div>
      <div><strong>Cash:</strong> ₱<span id="cash"></span></div>
      <div><strong>Change:</strong> ₱<span id="change"></span></div>
    </div>

    <div class="thank-you">Thank you for ordering!</div>
    <img src="images/logo.png" alt="Footer" class="footer-img">
  </div>

  <script>
    // Dummy data if you're not using URL params
    const data = {
      items: [
        { name: 'Ham & Cheese Croissant', qty: 1, subtotal: 90 }
      ],
      total: 120,
      cash: 500,
      change: 380
    };

    const dateTime = new Date().toLocaleString();
    document.getElementById('date-time').textContent = dateTime;

    const itemsContainer = document.getElementById('receipt-items');
    data.items.forEach(item => {
      itemsContainer.innerHTML += `
        <tr>
          <td>${item.name}</td>
          <td>${item.qty}</td>
          <td>₱${item.subtotal}</td>
        </tr>
      `;
    });

    document.getElementById('total').textContent = data.total;
    document.getElementById('cash').textContent = data.cash;
    document.getElementById('change').textContent = data.change;
  </script>
</body>
</html>
